openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Permionics BD Suite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: case-studies
    description: Case Study Library
  - name: questionnaires
    description: Questionnaire Builder
  - name: chat
    description: BD Assistant chatbot
  - name: dashboard
    description: Dashboard statistics
  - name: settings
    description: Settings management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and clear session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Check current auth status
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /case-studies:
    get:
      operationId: listCaseStudies
      tags: [case-studies]
      summary: List all case studies with optional filters
      parameters:
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: technology
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of case studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseStudy"
    post:
      operationId: createCaseStudy
      tags: [case-studies]
      summary: Create a new case study
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStudyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudy"

  /case-studies/{id}:
    get:
      operationId: getCaseStudy
      tags: [case-studies]
      summary: Get a single case study by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case study detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCaseStudy
      tags: [case-studies]
      summary: Update an existing case study
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStudyPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCaseStudy
      tags: [case-studies]
      summary: Delete a case study
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /questionnaires:
    get:
      operationId: listQuestionnaires
      tags: [questionnaires]
      summary: List all saved questionnaires
      responses:
        "200":
          description: List of questionnaires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Questionnaire"
    post:
      operationId: createQuestionnaire
      tags: [questionnaires]
      summary: Save a completed questionnaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionnaireInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questionnaire"

  /questionnaires/{id}:
    get:
      operationId: getQuestionnaire
      tags: [questionnaires]
      summary: Get a single questionnaire
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Questionnaire detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questionnaire"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteQuestionnaire
      tags: [questionnaires]
      summary: Delete a questionnaire
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the BD Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: BD Assistant response with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /settings/change-password:
    post:
      operationId: changePassword
      tags: [settings]
      summary: Change the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        message:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
        remember:
          type: boolean

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 6

    DashboardStats:
      type: object
      required: [totalCaseStudies, totalQuestionnaires, sectorsCount, lastUpdated, recentActivity]
      properties:
        totalCaseStudies:
          type: integer
        totalQuestionnaires:
          type: integer
        sectorsCount:
          type: integer
        lastUpdated:
          type: ["string", "null"]
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [type, title, sector, createdAt]
      properties:
        type:
          type: string
        id:
          type: integer
        title:
          type: string
        sector:
          type: string
        createdAt:
          type: string

    CaseStudy:
      type: object
      required: [id, clientName, sector, location, challenge, solution, technologyStack, capacity, results, tags, fullText, createdAt, updatedAt]
      properties:
        id:
          type: integer
        clientName:
          type: string
        sector:
          type: string
        location:
          type: string
        challenge:
          type: string
        solution:
          type: string
        technologyStack:
          type: string
        capacity:
          type: string
        results:
          type: string
        testimonial:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        fullText:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    CaseStudyInput:
      type: object
      required: [clientName, sector, location, challenge, solution, technologyStack, capacity, results, tags, fullText]
      properties:
        clientName:
          type: string
          minLength: 1
        sector:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        challenge:
          type: string
          minLength: 1
        solution:
          type: string
          minLength: 1
        technologyStack:
          type: string
          minLength: 1
        capacity:
          type: string
          minLength: 1
        results:
          type: string
          minLength: 1
        testimonial:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        fullText:
          type: string

    CaseStudyPatch:
      type: object
      properties:
        clientName:
          type: string
          minLength: 1
        sector:
          type: string
        location:
          type: string
        challenge:
          type: string
        solution:
          type: string
        technologyStack:
          type: string
        capacity:
          type: string
        results:
          type: string
        testimonial:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        fullText:
          type: string

    AnswerMap:
      type: object
      additionalProperties:
        type: string

    Questionnaire:
      type: object
      required: [id, clientName, sector, questions, answers, createdAt]
      properties:
        id:
          type: integer
        clientName:
          type: string
        sector:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionItem"
        answers:
          $ref: "#/components/schemas/AnswerMap"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    QuestionItem:
      type: object
      required: [id, question, type]
      properties:
        id:
          type: string
        question:
          type: string
        type:
          type: string
        options:
          type: array
          items:
            type: string

    QuestionnaireInput:
      type: object
      required: [clientName, sector, questions, answers]
      properties:
        clientName:
          type: string
          minLength: 1
        sector:
          type: string
          minLength: 1
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionItem"
        answers:
          $ref: "#/components/schemas/AnswerMap"
        notes:
          type: ["string", "null"]

    ChatMessageInput:
      type: object
      required: [message, history]
      properties:
        message:
          type: string
          minLength: 1
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"

    ChatHistoryItem:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string

    ChatSource:
      type: object
      required: [id, clientName, sector]
      properties:
        id:
          type: integer
        clientName:
          type: string
        sector:
          type: string
        technologyStack:
          type: string

    ChatResponse:
      type: object
      required: [answer, sources]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ChatSource"
